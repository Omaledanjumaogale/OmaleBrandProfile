<!doctype html>
<html lang="en" class="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Theme FOUC prevention: applies saved theme before first paint -->
		<script>
			(function() {
				try {
					var t = localStorage.getItem('ewin-theme');
					var d = document.documentElement;
					d.classList.remove('dark', 'light');
					if (t === 'dark') { d.classList.add('dark'); }
					else { d.classList.add('light'); }
				} catch(e) {}
			})();
		</script>
		<meta name="description" content="Danjuma Umar Omale Ogale — AI-Augmented Developer, Sociologist, Business Strategist & Founder of the E-WIN Project. Building Africa's future through technology, research, and workforce innovation." />
		<meta name="keywords" content="Danjuma Omale, E-WIN Project, AI Developer, Business Strategy, I-AM Network, Elite Workforce Impact Nigeria, Africa Tech, Workforce Innovation" />
		<meta name="author" content="Danjuma Umar Omale Ogale" />
		<meta name="theme-color" content="#c9a84c" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="canonical" href="https://omaledanjumaogale.ewinproject.org/" />

		<!-- Google Fonts: Bebas Neue (display) + Space Mono (mono) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

		<!-- Preload hero image for LCP -->
		<link rel="preload" href="/danjuma-ogale.jpg" as="image" fetchpriority="high" />
		
		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://omaledanjumaogale.ewinproject.org/" />
		<meta property="og:title" content="Danjuma Omale Ogale — AI-Augmented Developer, Strategist & Founder" />
		<meta property="og:description" content="Personal brand portfolio of Danjuma Umar Omale Ogale — Sociologist, AI Developer, Business Strategist, and Founder of the E-WIN Project ecosystem." />
		<meta property="og:image" content="https://omaledanjumaogale.ewinproject.org/danjuma-ogale.jpg" />

		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://omaledanjumaogale.ewinproject.org/" />
		<meta property="twitter:title" content="Danjuma Omale Ogale — AI Developer & Founder" />
		<meta property="twitter:description" content="Sociologist, Strategist, and Builder architecting systems to upskill Africa's workforce through the E-WIN Project." />
		<meta property="twitter:image" content="https://omaledanjumaogale.ewinproject.org/danjuma-ogale.jpg" />

		<!-- Microdata / JSON-LD -->
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "Person",
			"name": "Danjuma Umar Omale Ogale",
			"url": "https://omaledanjumaogale.ewinproject.org/",
			"jobTitle": "AI-Augmented Developer & Founder",
			"worksFor": {
				"@type": "Organization",
				"name": "E-WIN Project"
			},
			"description": "Sociologist, Strategist, and Builder architecting systems to upskill Africa's workforce.",
			"sameAs": [
				"https://linkedin.com/in/omaledanjumaogale"
			]
		}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
